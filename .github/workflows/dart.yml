name: Build Gestion Espoir APK

on:
  push:
    branches: [ main, master, principal ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Gestion-Espoir
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true
          
      - run: flutter pub get
      - run: flutter build apk --release --target=lib/main.dart
      
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: Gestion-Espoir/build/app/outputs/flutter-apk/app-release.apk
